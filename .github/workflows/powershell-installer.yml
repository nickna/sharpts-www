name: PowerShell installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/powershell-installer.yml"
      - "setup.ps1"
      - "setup.sh"
      - "scripts/test-setup.ps1"
      - "scripts/test-setup.sh"
      - "**/*.ps1"
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/powershell-installer.yml"
      - "setup.ps1"
      - "setup.sh"
      - "scripts/test-setup.ps1"
      - "scripts/test-setup.sh"
      - "**/*.ps1"

permissions:
  contents: read

concurrency:
  group: powershell-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-setup.ps1

  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test with PowerShell 7
        shell: pwsh
        run: ./scripts/test-setup.ps1
