name: Self-host container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - "biome.json"
      - ".github/workflows/self-host-container.yml"
      - "Dockerfile.selfhost"
      - "lib/SharpTS"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "railway.json"
      - "sharpts-source.env"
      - "scripts/build-browser.mjs"
      - "scripts/build-self-host.mjs"
      - "scripts/check-browser-budget.mjs"
      - "scripts/scan-secrets.mjs"
      - "scripts/build-self-host.ps1"
      - "scripts/build-self-host.sh"
      - "scripts/run.ps1"
      - "scripts/run.sh"
      - "scripts/test-apphost-manifest.ps1"
      - "scripts/test-browser-bundle.mjs"
      - "scripts/test-generated-site.ps1"
      - "scripts/test-self-host-container.ps1"
      - "src/SharpTS.Www.AppHost/**"
      - "src/SharpTS.Www.SelfHost/**"
      - "src/SharpTS.Www.Shared/**"
      - "src/SharpTS.Www.Worker/**"
      - "tests/**"
      - "tsconfig.json"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - "biome.json"
      - ".github/workflows/self-host-container.yml"
      - "Dockerfile.selfhost"
      - "lib/SharpTS"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "railway.json"
      - "sharpts-source.env"
      - "scripts/build-browser.mjs"
      - "scripts/build-self-host.mjs"
      - "scripts/check-browser-budget.mjs"
      - "scripts/scan-secrets.mjs"
      - "scripts/build-self-host.ps1"
      - "scripts/build-self-host.sh"
      - "scripts/run.ps1"
      - "scripts/run.sh"
      - "scripts/test-apphost-manifest.ps1"
      - "scripts/test-browser-bundle.mjs"
      - "scripts/test-generated-site.ps1"
      - "scripts/test-self-host-container.ps1"
      - "src/SharpTS.Www.AppHost/**"
      - "src/SharpTS.Www.SelfHost/**"
      - "src/SharpTS.Www.Shared/**"
      - "src/SharpTS.Www.Worker/**"
      - "tests/**"
      - "tsconfig.json"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: self-host-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pinned submodules
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify immutable SharpTS input
        run: npm run verify:source

      - name: Build the local Aspire topology
        shell: bash
        run: |
          bash ./scripts/build-self-host.sh Debug
          dotnet build src/SharpTS.Www.AppHost/SharpTS.Www.AppHost.csproj -c Debug

      - name: Verify generated localized pages and CSS
        shell: pwsh
        run: ./scripts/test-generated-site.ps1

      - name: Verify Aspire proxy and origin wiring
        shell: pwsh
        run: ./scripts/test-apphost-manifest.ps1

      - name: Verify source, secrets, formatting, types, tests, and browser budgets
        run: npm run verify

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Verify browser parity against the SharpTS host
        run: npm run test:e2e

      - name: Build and test the Linux self-host image
        shell: pwsh
        run: ./scripts/test-self-host-container.ps1
