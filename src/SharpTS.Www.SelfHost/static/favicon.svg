<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 321" role="img" aria-labelledby="title desc">
  <title id="title">SharpTS logo</title>
  <desc id="desc">A faceted purple and blue crystal behind an orange lightning bolt and a blue badge marked TS.</desc>
  <defs>
    <linearGradient id="crystal" x1="51" y1="48" x2="286" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d777e6"/>
      <stop offset=".38" stop-color="#6c38ac"/>
      <stop offset=".72" stop-color="#23569c"/>
      <stop offset="1" stop-color="#111c58"/>
    </linearGradient>
    <linearGradient id="ice" x1="93" y1="17" x2="273" y2="287" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6edff"/>
      <stop offset=".25" stop-color="#5bb5df"/>
      <stop offset=".58" stop-color="#6d50c0"/>
      <stop offset="1" stop-color="#172b69"/>
    </linearGradient>
    <linearGradient id="badge" x1="210" y1="91" x2="335" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#397fba"/>
      <stop offset="1" stop-color="#2d6da9"/>
    </linearGradient>
    <linearGradient id="bolt" x1="217" y1="44" x2="127" y2="293" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7a1"/>
      <stop offset=".28" stop-color="#ffc83f"/>
      <stop offset=".68" stop-color="#ff7920"/>
      <stop offset="1" stop-color="#ffbd34"/>
    </linearGradient>
    <linearGradient id="boltEdge" x1="218" y1="42" x2="120" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1a4"/>
      <stop offset=".52" stop-color="#ff9b27"/>
      <stop offset="1" stop-color="#e94e20"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071239" flood-opacity=".65"/>
    </filter>
    <filter id="glow" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff8b26" flood-opacity=".8"/>
    </filter>
  </defs>

